name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-build-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:run
      - run: npm run build
      - run: npm run bench
        env:
          CATEGORY_BENCH_BUDGET_MULTIPLIER: 2
